<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Portal Unificado | Camargo Group - Convenios BCP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23002A8F'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FF7800'/%3E%3C/svg%3E">
<style>
:root{--blue:#002A8F;--blue-d:#001B5E;--orange:#FF7800;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s700:#334155;--s800:#1e293b;--s900:#0f172a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0b1329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5; user-select:none; -webkit-user-select:none;}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Login */
.login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(2,6,23,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card{position:relative;overflow:hidden;width:100%;max-width:28rem;padding:2rem;background:#fff;border:1px solid var(--s200);border-radius:1.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.4)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:.5rem;background:linear-gradient(90deg,#1e3a8a,#4f46e5,var(--orange))}
.head{margin-bottom:1.5rem;text-align:center}
.badge{display:inline-flex;margin-bottom:.75rem;padding:.75rem;font-size:1.875rem;color:var(--blue);background:#eff6ff;border-radius:1rem;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
h1{margin:0;font-size:1.25rem;font-weight:900;letter-spacing:-.025em;color:var(--blue)}
.sub{margin:.25rem 0 0;font-size:.75rem;color:var(--s500)}
form{display:grid;gap:1rem}
label{display:block;margin-bottom:.25rem;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--s700)}
.fld{position:relative}
.fld .i{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);font-size:.875rem;color:var(--s400)}
input{width:100%;padding:.625rem .875rem .625rem 2.5rem;font-size:.875rem;color:var(--s900);background:#fff;border:1px solid var(--s300);border-radius:.75rem}
input:focus{outline:2px solid var(--blue);border-color:transparent}
.err{padding:.625rem;font-size:.75rem;font-weight:600;text-align:center;color:#e11d48;background:#fff1f2;border:1px solid #fecdd3;border-radius:.75rem}
.go{padding:.75rem;font-size:.875rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--blue),#1e40af);border-radius:.75rem;box-shadow:0 4px 6px rgba(0,0,0,.15)}
.go:hover{background:linear-gradient(90deg,var(--blue-d),#312e81)}
.go:disabled{opacity:.7;cursor:wait}

/* App */
.app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;color:#fff}
.top{flex:none;z-index:30;background:var(--s900);border-bottom:1px solid var(--s800)}
.top-status,.top-nav{display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem}
.top-status{font-size:.75rem;border-bottom:1px solid var(--s800)}
.brand{display:flex;align-items:center;gap:.5rem;padding:.25rem .75rem;background:var(--s900);border:1px solid var(--s700);border-radius:99px}
.brand b{color:var(--s200)}
.brand .x{color:var(--s500)}
.brand .c{font-weight:600;color:#60a5fa}
.dot{width:.5rem;height:.5rem;background:#34d399;border-radius:50%;animation:p 2s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
.tag{padding:.125rem .5rem;font-size:.625rem;color:#93c5fd;background:rgba(30,58,138,.6);border-radius:.25rem}
.ses{display:flex;align-items:center;gap:.375rem;margin-left:auto;font-size:.6875rem;color:var(--s400)}
.top-nav{background:rgba(30,41,59,.7)}
.tabs{display:flex;flex:1;gap:.375rem;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;flex:none;align-items:center;gap:.5rem;padding:.375rem .875rem;font-size:.75rem;font-weight:700;color:var(--s300);background:var(--s800);border-radius:.5rem}
.tab:hover{background:var(--s700)}
.tab[aria-selected=true]{color:#fff;background:#2563eb;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.acts{display:flex;flex:none;gap:.5rem}
.ibtn{display:flex;align-items:center;justify-content:center;gap:.375rem;min-width:2rem;height:2rem;padding:0 .5rem;font-size:.875rem;color:var(--s300);background:var(--s800);border-radius:.5rem}
.ibtn:hover{background:var(--s700)}
.ibtn .lbl{font-size:.75rem;font-weight:600}
.out{padding:0 .75rem;color:#fda4af;background:rgba(244,63,94,.2);border:1px solid rgba(244,63,94,.3);border-radius:99px}
.out:hover{background:rgba(244,63,94,.3)}

/* Paneles e iframes */
.paneles{position:relative;flex:1;min-height:0;background:#fff}
.panel{position:absolute;inset:0}
iframe{display:block;width:100%;height:100%;border:0}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:1rem;font-size:.875rem;text-align:center;color:var(--s500);background:#fff}
.ov p{max-width:26rem;margin:0}
.ov-b{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.btn{padding:.5rem 1rem;font-size:.8125rem;font-weight:700;color:#fff;background:var(--blue);border-radius:.625rem}
.btn:hover{background:var(--blue-d)}
.spin{width:2rem;height:2rem;border:3px solid var(--s200);border-top-color:var(--blue);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(1turn)}}

@media (max-width:639px){.top-status,.ibtn .lbl{display:none}.out{padding:0 .5rem}}
@media (pointer:coarse){.tab,.ibtn{min-height:2.75rem}.ibtn{min-width:2.75rem}}
@media (prefers-reduced-motion:reduce){.dot,.spin{animation:none}}
</style>
</head>
